name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app gradle temp_extract || true
          mkdir temp_extract
          unzip -o SitambukProject-Android-Project.zip -d temp_extract
          echo "=== ISI TEMP ==="
          ls temp_extract
          echo "=== CARI GRADLEW ==="
          find temp_extract -name "gradlew" -type f
          PROJECT_DIR=$(find temp_extract -name "gradlew" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradlew not found, pakai temp_extract langsung"
            PROJECT_DIR="temp_extract"
            # cek apakah ada subfolder
            if [ -d "temp_extract/SitambukProject-Android-Project" ]; then
              PROJECT_DIR="temp_extract/SitambukProject-Android-Project"
            fi
          fi
          echo "COPY FROM: $PROJECT_DIR"
          cp -rf $PROJECT_DIR/. .
          rm -rf temp_extract *.zip
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sitambuk-APK
          path: app/build/outputs/apk/debug/*.apk
