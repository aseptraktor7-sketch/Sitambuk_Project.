name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app gradle temp_extract || true
          mkdir temp_extract
          unzip -o SitambukProject-Android-Project.zip -d temp_extract
          ls -R temp_extract | head -n 100
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          PROJECT_DIR=$(find temp_extract -name "gradlew" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
          fi
          echo "Build di folder: $PROJECT_DIR"
          ls -la $PROJECT_DIR
          cd $PROJECT_DIR
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sitambuk-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            temp_extract/**/app/build/outputs/apk/debug/*.apk
