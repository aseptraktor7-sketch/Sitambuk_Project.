name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties || true
          unzip -o SitambukProject-Android-Project.zip -d temp_extract
          FOUND=$(find temp_extract -name "gradlew" -type f | head -n 1)
          echo "Found: $FOUND"
          DIR=$(dirname "$FOUND")
          echo "Dir: $DIR"
          cp -r $DIR/* .
          cp -r $DIR/.* . 2>/dev/null || true
          rm -rf temp_extract *.zip
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sitambuk-APK
          path: app/build/outputs/apk/debug/*.apk
