name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o SitambukProject-Android-Project.zip -d .
          ls -la
          # Cari dimana gradlew ngumpet
          FOUND=$(find . -name "gradlew" -type f | head -n 1)
          echo "Found gradlew at: $FOUND"
          DIR=$(dirname "$FOUND")
          echo "Project folder: $DIR"
          # Pindahin semua isi ke root
          cp -r $DIR/* .
          cp -r $DIR/.* . 2>/dev/null || true
          rm -rf SitambukProject-Android-Project
          rm -f *.zip
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sitambuk-APK
          path: app/build/outputs/apk/debug/*.apk
