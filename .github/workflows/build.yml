name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app gradle || true
          rm -rf temp_extract || true
          unzip -o SitambukProject-Android-Project.zip -d .
          ls -la
          # cari folder yang ada app
          PROJECT_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project di: $PROJECT_DIR"
          ls -la $PROJECT_DIR
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          echo "Build di: ${{ env.PROJECT_DIR }}"
          cd ${{ env.PROJECT_DIR }}
          ls -la
          # kalau ada gradlew pakai itu, kalau gak ada pakai gradle langsung
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew gak ada, pakai gradle langsung"
            gradle assembleDebug
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sitambuk-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
