name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          rm -rf app gradle temp_extract || true
          unzip -o SitambukProject-Android-Project.zip -d temp_extract
          ls -la temp_extract
          PROJECT_DIR=$(find temp_extract -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Project found at: $PROJECT_DIR"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(ls -d temp_extract/*/ | head -n 1)
            echo "Fallback to: $PROJECT_DIR"
          fi
          mv $PROJECT_DIR/* . 2>/dev/null || true
          mv $PROJECT_DIR/.* . 2>/dev/null || true
          rm -rf temp_extract *.zip
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sitambuk-APK
          path: app/build/outputs/apk/debug/*.apk
