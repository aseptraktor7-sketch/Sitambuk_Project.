name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf app gradle temp_extract || true
          mkdir temp_extract
          unzip -o SitambukProject-Android-Project.zip -d temp_extract
          PROJECT_DIR=$(find temp_extract -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Project dir: $PROJECT_DIR"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find temp_extract -type d | head -n 2 | tail -n 1)
          fi
          echo "Copy from $PROJECT_DIR"
          cp -rf $PROJECT_DIR/. .
          rm -rf temp_extract *.zip
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sitambuk-APK
          path: app/build/outputs/apk/debug/*.apk
